---

#
# Definitions for Krusader docker container.
#
# This file is used as data source to generate README.md and unRAID template files
# from Jinja2 templates.
#

app:
  id: 36
  name: krusader
  friendly_name: Krusader
  gui_type: x11
  base_os: alpine
  project:
    description: |-
      Krusader is an advanced, twin-panel (commander-style) file manager for
      Unix-like systems. It offers powerful file management features including archive
      handling, access to local and remote filesystems, advanced search, directory
      synchronization, file comparison, and batch renaming.
    url: https://krusader.org
  unraid:
    #support_url: https://forums.unraid.net/topic/XXXXX-support-krusader/
    category: "Productivity: Tools:"
  documentation:
  changelog:
    - version: 26.07.1
      date: 2026-07-08
      changes:
        - 'Updated baseimage to version 4.12.5, bringing the following changes:'
        - '2:Added the ability to run the container with read-only filesystem.'
        - '2:Added the ability to configure the shell used by the web terminal.'
        - '2:Enabled window shadows to improve support of GTK4 applications.'
        - '2:Switched to fastcompmgr as the X compositor.'
        - '2:Updated TigerVNC to version 1.16.2.'
        - '2:Updated noVNC to version 1.7.0.'
        - '2:Improved web authentication compatibility with reverse proxies by using relative redirects.'
        - '2:Force usage of the local X display to avoid connecting to the host X server in Docker host network mode.'
    - version: 26.03.1
      date: 2026-03-14
      changes:
        - 'Updated baseimage to version 4.11.3, bringing the following changes:'
        - '2:Enable xcompmgr output only when debug is enabled.'
        - '2:Enhanced self-signed certificates by including the Subject Alternative Name (SAN) and using the container hostname instead of a dummy domain name.'
    - version: 26.02.4
      date: 2026-02-22
      changes:
        - 'Updated baseimage to version 4.11.2, bringing the following changes:'
        - '2:Fixed X server failing to find the appropriate Mesa driver on some setups.'
    - version: 26.02.3
      date: 2026-02-19
      changes:
        - 'Updated baseimage to version 4.11.1, bringing the following changes:'
        - '2:Fixed issue where taking ownership of directory would fail.'
    - version: 26.02.2
      date: 2026-02-18
      changes:
        - 'Fixed dark mode not applied to KRename.'
        - 'Updated baseimage to version 4.11.0, bringing the following improvements:'
        - '2:Added a web terminal providing shell access to the container.'
        - '2:Fixed audio being paused when switching to another browser tab.'
        - '2:Web file manager is now displayed in a modal window.'
        - '2:Fixed several web file manager issues:'
        - '3:Uploading zero-byte files no longer fails.'
        - '3:Interrupted uploads no longer interfere with other uploads.'
        - '3:Error reporting is now more accurate.'
        - '2:Improved web services server stability and reliability.'
        - '2:Updated TigerVNC to 1.16.0 and X server to 21.1.21.'
    - version: 26.02.1
      date: 2026-02-06
      changes:
        - 'Fixed an issue where some UI icons were missing.'
        - 'Added unrar to the available tools.'
    - version: 26.01.1
      date: 2026-01-24
      changes:
        - 'Initial release.'

container:
  storage_permissions: rw

  # Environment variables.
  environment_variables: []

  # Volumes
  volumes: []

  # Network ports
  ports: []

  # Devices
  devices: []
